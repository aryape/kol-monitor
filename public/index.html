<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOL & Affiliate Performance Monitor</title>
    <style>
        :root {
            --bg-color: #f4f7fa;
            --primary: #0056b3;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-muted: #6c757d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .input-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            height: 40px;
            align-self: flex-end;
        }
        button:hover {
            background-color: #004494;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        .metric-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .metric-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Dashboard Monitor KOL & Affiliate</h2>
        <p>Lacak performa postingan dan hitung metrik finansial secara real-time</p>
    </div>

    <!-- Input Form -->
    <div class="input-section">
        <div class="input-group">
            <label for="post-link">URL Postingan (IG / TikTok)</label>
            <input type="url" id="post-link" placeholder="Contoh: https://vt.tiktok.com/..." required>
        </div>
        <div class="input-group">
            <label for="budget-input">Budget (Rp)</label>
            <input type="number" id="budget-input" placeholder="Contoh: 1000000" required>
        </div>
        <button onclick="analyzePost()">Analisis Data</button>
    </div>

    <!-- Dashboard Metrics -->
    <div class="dashboard-grid" id="metrics-container" style="display: none;">
        <div class="metric-card">
            <div class="metric-title">Views</div>
            <div class="metric-value" id="val-views">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Likes</div>
            <div class="metric-value" id="val-likes">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Comments</div>
            <div class="metric-value" id="val-comments">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Shares</div>
            <div class="metric-value" id="val-shares">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Saves</div>
            <div class="metric-value" id="val-saves">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Cost / View</div>
            <div class="metric-value" id="val-cpv">Rp 0</div>
        </div>
        <div class="metric-card hidden" id="card-gmv">
            <div class="metric-title">Est. GMV (TikTok)</div>
            <div class="metric-value" id="val-gmv">Rp 0</div>
        </div>
    </div>
</div>

<script>
    // Fungsi format rupiah
    const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0
        }).format(angka);
    };

    // Fungsi format angka ribuan (K, M)
    const formatNumber = (num) => {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num;
    };

    async function analyzePost() {
    const link = document.getElementById('post-link').value;
    const budget = parseFloat(document.getElementById('budget-input').value);

    if (!link || isNaN(budget)) {
        alert("Harap masukkan link postingan dan budget yang valid!");
        return;
    }

    // Tampilkan kontainer metrik dengan teks "Loading..."
    document.getElementById('metrics-container').style.display = 'grid';
    document.getElementById('val-views').innerText = "Loading...";
    document.getElementById('val-likes').innerText = "Loading...";
    document.getElementById('val-comments').innerText = "Loading...";
    document.getElementById('val-shares').innerText = "Loading...";
    document.getElementById('val-saves').innerText = "Loading...";
    document.getElementById('val-cpv').innerText = "Loading...";
    document.getElementById('val-gmv').innerText = "Loading...";

    const isTikTok = link.toLowerCase().includes('tiktok.com');
    const gmvCard = document.getElementById('card-gmv');
    if (isTikTok) gmvCard.classList.remove('hidden');
    else gmvCard.classList.add('hidden');

    try {
        // Panggil API Backend Node.js
        const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ url: link })
        });

        const data = await response.json();

        if (!response.ok) {
            alert("Error dari server: " + (data.error || "Terjadi kesalahan"));
            return;
        }

        // Kalkulasi Cost Per View (CPV)
        const costPerView = budget / data.views;

        // Render ke UI
        document.getElementById('val-views').innerText = formatNumber(data.views);
        document.getElementById('val-likes').innerText = formatNumber(data.likes);
        document.getElementById('val-comments').innerText = formatNumber(data.comments);
        document.getElementById('val-shares').innerText = formatNumber(data.shares);
        document.getElementById('val-saves').innerText = formatNumber(data.saves);
        document.getElementById('val-cpv').innerText = formatRupiah(costPerView);
        
        if (isTikTok) {
            document.getElementById('val-gmv').innerText = formatRupiah(data.gmv);
        }

    } catch (error) {
        console.error("Gagal terhubung ke backend:", error);
        alert("Gagal terhubung ke server. Pastikan server Node.js sedang berjalan.");
    }
}
</script>
</body>
</html>
