<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Campaign Dashboard Monitor</title>
    <style>
        /* CSS Dasar untuk mengatur view */
        body { font-family: sans-serif; background: #f4f7fa; padding: 20px; }
        .view-section { display: none; } /* Semua section disembunyikan default */
        .view-section.active { display: block; } /* Hanya yang active yang muncul */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-overlay.active { display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 400px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        button { cursor: pointer; padding: 10px 15px; background: #f68b1f; color: white; border: none; border-radius: 5px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #f68b1f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 1. HOMESCREEN -->
    <div id="view-homescreen" class="view-section active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Dashboard Performa Campaign</h2>
            <div>
                <button>Monthly</button> <button>Weekly</button>
                <button onclick="toggleModal(true)">+ Add Campaign</button>
            </div>
        </div>
        
        <table id="campaign-table">
            <thead>
                <tr>
                    <th>Nama Campaign</th>
                    <th>Total Views</th>
                    <th>Total Likes</th>
                    <th>Avg Cost/View</th>
                </tr>
            </thead>
            <tbody id="campaign-list">
                <!-- Data agregasi campaign akan dirender di sini -->
            </tbody>
        </table>
    </div>

    <!-- 2. OVERLAY ADD CAMPAIGN -->
    <div id="modal-add" class="modal-overlay">
        <div class="modal-content">
            <h3>Add Campaign</h3>
            <label>Nama Campaign*</label><br>
            <input type="text" id="new-campaign-name" style="width: 100%; margin-bottom: 15px;"><br>
            <label>Produk*</label><br>
            <input type="text" id="new-product-name" style="width: 100%; margin-bottom: 15px;"><br>
            <button onclick="createCampaign()" style="width: 100%;">Tambah Campaign</button>
            <button onclick="toggleModal(false)" style="width: 100%; margin-top: 10px; background: #ccc;">Batal</button>
        </div>
    </div>

    <!-- 3. INPUT DATA BASE -->
    <div id="view-input" class="view-section">
        <button onclick="switchView('view-homescreen')">&larr; Back to Home</button>
        <h2 id="active-campaign-title">Input Data - Campaign Name</h2>
        
        <div style="background: white; padding: 20px; margin-top: 20px; border-radius: 8px;">
            <label>Url Postingan (pisahkan dengan koma)*</label><br>
            <textarea id="url-inputs" rows="4" style="width: 100%; margin-bottom: 15px;"></textarea><br>
            
            <label>Budget Campaign*</label><br>
            <input type="number" id="budget-input" style="width: 100%; margin-bottom: 15px;"><br>
            
            <button onclick="analyzeMultiplePosts()" style="width: 100%;">Analisa Postingan</button>
        </div>

        <!-- Scraping on Process (Loading) -->
        <div id="loading-state" style="display: none; text-align: center; padding: 40px;">
            <div class="spinner"></div>
            <p>Scraping data on progress. Please wait...</p>
        </div>

        <!-- Scraping Done (Hasil) -->
        <table id="result-table" style="display: none;">
            <thead>
                <tr>
                    <th>Nama Akun</th>
                    <th>Views</th>
                    <th>Likes</th>
                    <th>Cost/view</th>
                </tr>
            </thead>
            <tbody id="result-list"></tbody>
        </table>
    </div>

    <script>
        // State Management
        let currentCampaign = {};

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function toggleModal(show) {
            document.getElementById('modal-add').classList.toggle('active', show);
        }

        function createCampaign() {
            const name = document.getElementById('new-campaign-name').value;
            if(!name) return alert('Nama wajib diisi');
            
            // Simulasikan pembuatan pool di tabel Homescreen
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="cursor:pointer; color:blue;" onclick="goToInput('${name}')">${name} &gt;</td>
                <td>-</td><td>-</td><td>-</td>
            `;
            document.getElementById('campaign-list').appendChild(tr);
            toggleModal(false);
        }

        function goToInput(campaignName) {
            currentCampaign.name = campaignName;
            document.getElementById('active-campaign-title').innerText = `Input Data - ${campaignName}`;
            
            // Reset state
            document.getElementById('url-inputs').value = '';
            document.getElementById('budget-input').value = '';
            document.getElementById('result-table').style.display = 'none';
            
            switchView('view-input');
        }

        async function analyzeMultiplePosts() {
            const urlsRaw = document.getElementById('url-inputs').value;
            const budget = parseFloat(document.getElementById('budget-input').value);
            
            if(!urlsRaw || isNaN(budget)) return alert('URL dan Budget wajib diisi');
            
            // Bersihkan string URL dari spasi dan enter
            const urls = urlsRaw.split(',').map(url => url.trim()).filter(url => url !== "");

            // Munculkan Loading Screen
            document.getElementById('loading-state').style.display = 'block';
            document.getElementById('result-table').style.display = 'none';

            try {
                const response = await fetch('/api/analyze-multiple', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls: urls })
                });

                const results = await response.json();
                
                // Kalkulasi CPV (Asumsi: Budget dibagi rata ke semua postingan)
                const budgetPerPost = budget / results.length;

                // Render ke Tabel Hasil
                const tbody = document.getElementById('result-list');
                tbody.innerHTML = ''; // Bersihkan tabel
                
                results.forEach(item => {
                    const cpv = item.views > 0 ? (budgetPerPost / item.views) : 0;
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.author}</td>
                            <td>${item.views.toLocaleString('id-ID')}</td>
                            <td>${item.likes.toLocaleString('id-ID')}</td>
                            <td>Rp ${cpv.toFixed(2)}</td>
                        </tr>
                    `;
                });

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('result-table').style.display = 'table';

            } catch (error) {
                alert('Gagal mengambil data dari server');
                document.getElementById('loading-state').style.display = 'none';
            }
        }
    </script>
</body>
</html>
